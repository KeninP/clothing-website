trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  acrName: 'clothingacr891'
  acrLoginServer: 'clothingacr891.azurecr.io'
  imageName: 'clothing-website'
  imageTag: '$(Build.BuildId)'
  aksResourceGroup: 'clothing-rg'
  aksClusterName: 'clothing-aks'

stages:
- stage: Build
  displayName: 'Build and Push to ACR'
  jobs:
  - job: Build
    steps:
    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image'
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)
          docker build -t $(acrLoginServer)/$(imageName):$(imageTag) .
          docker push $(acrLoginServer)/$(imageName):$(imageTag)

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: 'Deploy to AKS'
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName)
          kubectl set image deployment/clothing-app clothing-app=$(acrLoginServer)/$(imageName):$(imageTag)
          kubectl rollout status deployment/clothing-app